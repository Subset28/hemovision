name: Generate Code PDF

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y enscript ghostscript

      - name: Combine Code Files
        run: |
          # Create a clean file. No headers, just the raw code.
          touch combined_code.txt
          
          # Only include .swift and Package.swift.
          # EXCLUDE OpenImagesV7Mapping.swift because it is just 600 lines of string data.
          find ios -name "*.swift" -o -name "Package.swift" | sort | while read file; do
            if [[ "$file" == *"OpenImagesV7Mapping.swift"* ]]; then
              echo "// Skipping data file: $file"
              continue
            fi
            
            echo "// MARK: - $file" >> combined_code.txt
            echo "" >> combined_code.txt
            cat "$file" >> combined_code.txt
            echo "" >> combined_code.txt
            echo "" >> combined_code.txt
          done

      - name: Convert to PDF
        run: |
          # -C: Add line numbers for readability
          # -j: Add a nice border around each page
          enscript -C -j -p combined_code.ps combined_code.txt
          ps2pdf combined_code.ps source_code_submission.pdf

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Source Code PDF
          path: source_code_submission.pdf
