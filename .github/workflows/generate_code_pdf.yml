name: Generate Code PDF

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y highlight wkhtmltopdf

      - name: Create Student-Style Documentation
        run: |
          # Create a simpler, student-appropriate cover page
          echo "OmniSight - Visual Navigation App" > documentation.txt
          echo "Software Development Submission" >> documentation.txt
          echo "------------------------------------------------" >> documentation.txt
          echo "Created by: Sight-Seekers Team" >> documentation.txt
          echo "Date: April 2026" >> documentation.txt
          echo "" >> documentation.txt
          echo "TABLE OF CONTENTS" >> documentation.txt
          echo "------------------------------------------------" >> documentation.txt
          
          # List files manually for that "hand-organized" look
          find ios -name "*.swift" -o -name "Package.swift" | sort | while read file; do
            echo " - $file" >> documentation.txt
          done
          
          echo "" >> documentation.txt
          echo "------------------------------------------------" >> documentation.txt
          echo "SOURCE CODE" >> documentation.txt
          echo "------------------------------------------------" >> documentation.txt
          echo "" >> documentation.txt

      - name: Combine All Source Code
        run: |
          find ios -name "*.swift" -o -name "Package.swift" | sort | while read file; do
            echo "// MARK: - $file" >> documentation.txt
            echo "" >> documentation.txt
            cat "$file" >> documentation.txt
            echo "" >> documentation.txt
            echo "" >> documentation.txt
          done

      - name: Convert to PDF
        run: |
          # Step 1: Use highlight to generate HTML (standard for high schoolers printing from VS Code)
          highlight --out-format=html \
                    --inline-css \
                    --font="Courier" \
                    --font-size=10 \
                    --line-numbers \
                    --syntax=swift \
                    --input=documentation.txt \
                    --output=source_code.html
          
          # Step 2: Simple HTML to PDF conversion without the automated TOC generator
          wkhtmltopdf --enable-local-file-access \
                      source_code.html source_code_submission.pdf
          
      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Source Code PDF
          path: source_code_submission.pdf
