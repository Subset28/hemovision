name: Generate Code PDF

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y highlight wkhtmltopdf

      - name: Create Cover Page
        run: |
          echo "OmniSight - Visual Navigation System" > documentation.txt
          echo "Category: Software Development (High School)" >> documentation.txt
          echo "Project Entry: Source Code Documentation" >> documentation.txt
          echo "================================================" >> documentation.txt
          echo "" >> documentation.txt
          echo "SOURCE CODE LISTING" >> documentation.txt
          echo "================================================" >> documentation.txt
          echo "" >> documentation.txt

      - name: Combine All Source Code
        run: |
          find ios -name "*.swift" -o -name "Package.swift" | sort | while read file; do
            echo "// MARK: - $file" >> documentation.txt
            echo "" >> documentation.txt
            cat "$file" >> documentation.txt
            echo "" >> documentation.txt
            echo "" >> documentation.txt
          done

      - name: Convert to PDF with Clickable TOC
        run: |
          # Step 1: Generate high-quality HTML with syntax highlighting and line numbers
          highlight --out-format=html \
                    --inline-css \
                    --font="Courier" \
                    --font-size=10 \
                    --line-numbers \
                    --syntax=swift \
                    --input=documentation.txt \
                    --output=source_code.html
          
          # Step 2: Convert to PDF with an automatic Table of Contents
          wkhtmltopdf --enable-local-file-access \
                      toc \
                      source_code.html source_code_submission.pdf
          
      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Source Code PDF
          path: source_code_submission.pdf
