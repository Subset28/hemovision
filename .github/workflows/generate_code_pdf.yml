name: Build and Make PDF

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-app:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build App
        run: |
          xcodebuild -project ios/OmniSight/OmniSight.xcodeproj -scheme OmniSight -sdk iphoneos -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO clean build

  make-pdf:
    runs-on: ubuntu-latest
    needs: build-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate PDF using repo2pdf
        run: npx repo2pdf
          
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Source Code PDF
          path: repo2pdf.pdf
