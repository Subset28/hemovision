name: Generate Code PDF

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y enscript ghostscript

      - name: Combine All Code
        run: |
          echo "OmniSight - Source Code Submission" > combined_code.txt
          echo "Generated on $(date)" >> combined_code.txt
          echo "------------------------------------------------" >> combined_code.txt
          
          # Find all swift, plist, and package files
          find . -type f \( -name "*.swift" -o -name "Package.swift" -o -name "*.plist" \) -not -path "*/.*" | while read file; do
            echo "FILE: $file" >> combined_code.txt
            echo "------------------------------------------------" >> combined_code.txt
            cat "$file" >> combined_code.txt
            echo "" >> combined_code.txt
            echo "================================================" >> combined_code.txt
            echo "" >> combined_code.txt
          done
          
          # Check if the file is empty
          if [ ! -s combined_code.txt ]; then
            echo "Error: No source files found!"
            exit 1
          fi

      - name: Convert to PDF
        run: |
          # Use enscript to create a PostScript file, then convert to PDF
          # We removed -Eswift to ensure it doesn't fail on highlighting
          enscript -L 66 -p combined_code.ps combined_code.txt
          ps2pdf combined_code.ps source_code_submission.pdf

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Source Code PDF
          path: source_code_submission.pdf
