name: Build and Make PDF

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-app:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build App
        run: |
          xcodebuild -project ios/OmniSight/OmniSight.xcodeproj -scheme OmniSight -sdk iphoneos -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO clean build

  make-pdf:
    runs-on: ubuntu-latest
    needs: build-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tools
        run: sudo apt-get update && sudo apt-get install -y highlight wkhtmltopdf

      - name: Combine Code and Generate PDF
        run: |
          # Create a combined source file with headers
          > combined_source.swift
          find ios -name "*.swift" -type f | sort | while read file; do
            echo -e "\n\n// ==========================================" >> combined_source.swift
            echo "// FILE: $file" >> combined_source.swift
            echo "// ==========================================" >> combined_source.swift
            cat "$file" >> combined_source.swift
          done
          
          # Convert to HTML with syntax highlighting, line numbers, and word wrap
          highlight combined_source.swift \
            --syntax=swift \
            -O html \
            --style=xcode \
            --line-numbers \
            --wrap-simple \
            --font="'Menlo', 'Courier New', monospace" \
            --font-size=10 \
            -o source_code.html
            
          # Convert HTML to barebones PDF (no headers, no TOC, clean margins)
          wkhtmltopdf \
            --margin-top 15mm \
            --margin-bottom 15mm \
            --margin-left 15mm \
            --margin-right 15mm \
            --disable-smart-shrinking \
            source_code.html \
            source_code_submission.pdf
          
      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: Source Code PDF
          path: source_code_submission.pdf
