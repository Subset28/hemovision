name: Build and Make PDF

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-app:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build App
        run: |
          xcodebuild -project ios/OmniSightApp.xcodeproj -scheme OmniSightApp -sdk iphoneos -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO clean build

  make-pdf:
    runs-on: ubuntu-latest
    needs: build-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y highlight wkhtmltopdf

      - name: Make cover page
        run: |
          echo "OmniSight App Source Code" > documentation.txt
          echo "Copy of raw, executable code for submission" >> documentation.txt
          echo "Team: Sight-Seekers" >> documentation.txt
          echo "" >> documentation.txt
          echo "Files included:" >> documentation.txt
          find ios -name "*.swift" -o -name "Package.swift" | sort | while read file; do
            echo " - $file" >> documentation.txt
          done
          echo "" >> documentation.txt
          echo "Code:" >> documentation.txt
          echo "" >> documentation.txt

      - name: Combine code
        run: |
          find ios -name "*.swift" -o -name "Package.swift" | sort | while read file; do
            echo "// FILE: $file" >> documentation.txt
            echo "" >> documentation.txt
            cat "$file" >> documentation.txt
            echo "" >> documentation.txt
          done

      - name: Make PDF
        run: |
          highlight --out-format=html --inline-css --font="Courier" --font-size=10 --line-numbers --syntax=swift --input=documentation.txt --output=source_code.html
          wkhtmltopdf --enable-local-file-access source_code.html source_code_submission.pdf
          
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Source Code PDF
          path: source_code_submission.pdf
