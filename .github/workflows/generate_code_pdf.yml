name: Generate Code PDF

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y enscript ghostscript

      - name: Combine Code Files
        run: |
          # Create a clean file without timestamps
          echo "OmniSight - Source Code Submission" > combined_code.txt
          echo "------------------------------------------------" >> combined_code.txt
          
          # Only include .swift and Package.swift. Exclude any hidden directories.
          # Sorted for a consistent table of contents feel.
          find ios -name "*.swift" -o -name "Package.swift" | sort | while read file; do
            echo "FILE: $file" >> combined_code.txt
            echo "------------------------------------------------" >> combined_code.txt
            cat "$file" >> combined_code.txt
            echo "" >> combined_code.txt
            echo "================================================" >> combined_code.txt
            echo "" >> combined_code.txt
          done

      - name: Convert to PDF
        run: |
          # -C: Add line numbers
          # -j: Add a nice border around each page
          # -r: Landscape mode (optional, but good for wide code) - keeping portrait for now
          enscript -C -j -p combined_code.ps combined_code.txt
          ps2pdf combined_code.ps source_code_submission.pdf

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Source Code PDF
          path: source_code_submission.pdf
