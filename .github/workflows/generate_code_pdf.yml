name: Generate Code PDF

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y enscript ghostscript

      - name: Combine All Source Code
        run: |
          # Create a clean file. No external headers or timestamps.
          touch combined_code.txt
          
          # Include EVERY .swift file and Package.swift.
          # We use // MARK: for separators to keep the file valid as raw Swift code.
          find ios -name "*.swift" -o -name "Package.swift" | sort | while read file; do
            echo "// MARK: - $file" >> combined_code.txt
            echo "" >> combined_code.txt
            cat "$file" >> combined_code.txt
            echo "" >> combined_code.txt
            echo "" >> combined_code.txt
          done

      - name: Convert to PDF
        run: |
          # -C: Add line numbers (essential for competition review)
          # -j: Add a page border
          enscript -C -j -p combined_code.ps combined_code.txt
          ps2pdf combined_code.ps source_code_submission.pdf

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Source Code PDF
          path: source_code_submission.pdf
