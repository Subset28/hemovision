name: Build and Make PDF

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-app:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build App
        run: |
          xcodebuild -project ios/OmniSight/OmniSight.xcodeproj -scheme OmniSight -sdk iphoneos -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO clean build

  make-pdf:
    runs-on: ubuntu-latest
    needs: build-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PDF Tools
        run: sudo apt-get update && sudo apt-get install -y enscript ghostscript

      - name: Combine Code and Convert to PDF
        run: |
          # Combine all Swift files into a single text file
          find ios -name "*.swift" -type f | sort | while read file; do
            echo -e "\n\n// =========================================="
            echo "// FILE: $file"
            echo "// =========================================="
            cat "$file"
          done > source.txt
          
          # Convert text to PDF with line numbers (-C) and Courier font
          enscript -C -B --margins=50:50:50:50 -f Courier10 -p output.ps source.txt
          ps2pdf output.ps source_code_submission.pdf
          
      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: Source Code PDF
          path: source_code_submission.pdf
