# Role -> model routing config for research/llm/router.py.
#
# preferred_model is tried first; on failure, fallback_models are tried in
# order; if all fail (or no API key is configured at all, or the call is not
# authorized), the router raises LLMUnavailableError/LLMCallNotAuthorizedError
# and the caller is expected to degrade gracefully.
#
# Model IDs are OpenRouter model slugs. IMPORTANT (Phase G audit finding):
# the original master plan named specific free-tier models (MiniMax M3,
# NVIDIA Nemotron 3 Ultra, Poolside Laguna S 2.1, Cohere North Mini Code) —
# free-tier model availability on OpenRouter changes frequently and none of
# those slugs were verified live as part of this phase (verifying them would
# have spent the one authorized live call this phase is allowed to make on
# discovery rather than the actual smoke test). The preferred_model values
# below are a best-effort, UNVERIFIED guess at plausible current slugs;
# fallback_models ends with a well-established paid model as a safety net.
# Nothing here is called live in Phase G except the single, separate,
# explicitly-authorized smoke test in research/llm/smoke_test.py, which uses
# its OWN hand-picked model id (see that file's docstring) rather than any
# entry in this file. Re-verify these slugs before any future phase relies
# on them for a real call.
#
# Phase G completion-round finding: `meta-llama/llama-3.1-8b-instruct:free`
# (used above as a fallback for researcher/experiment_designer/reviewer/
# analyst, and originally as smoke_test.py's first-attempt model) is
# CONFIRMED STALE — a live call against it returned HTTP 404/
# MODEL_UNAVAILABLE. It is left in place here deliberately (per the task
# spec: "do not modify the global routing configuration merely to hide the
# stale-model problem before documenting it") rather than silently swapped
# out, since none of these role entries were exercised live in Phase G and
# fixing this file's guesses was explicitly out of this completion round's
# scope. smoke_test.py itself was updated to a freshly-verified-live slug
# (`poolside/laguna-s-2.1:free`, confirmed via OpenRouter's public /models
# catalog) for its own one-off second authorized call, which succeeded.

# Phase H completion-round finding (2026-09-05, before the live dry-run
# demonstration): a fresh, unauthenticated GET against OpenRouter's public
# /api/v1/models catalog (no API key, not routed through
# research/llm/openrouter.py, does not touch UsageTracker — not "a call"
# against Phase H's 3-live-call budget, same as Phase G's completion round)
# showed `nvidia/nemotron-nano-9b-v2:free` (researcher's prior
# preferred_model, guessed in Phase G, never verified live) is NOT in the
# current free-tier list — stale, same story as
# `meta-llama/llama-3.1-8b-instruct:free` (reviewer's prior preferred_model,
# already confirmed 404/MODEL_UNAVAILABLE in Phase G's completion round).
# Both are updated below to `poolside/laguna-s-2.1:free` — the exact slug
# Phase G's own smoke test already proved live end-to-end (see
# research/llm/smoke_test.py) — so the live demo does not spend part of its
# 3-call budget rediscovering a dead model. `meta-llama/llama-3.1-8b-
# instruct:free` is deliberately left in each fallback_models list, not
# deleted, as the documented record of what was already confirmed stale.
# Phase H completion RETRY (DRYRUN-0002, same day): a fresh, unauthenticated
# GET against OpenRouter's public /api/v1/models catalog re-confirmed
# `poolside/laguna-s-2.1:free` is still listed (it was never stale — the
# DRYRUN-0001 failure against it was HTTP 429, rate-limited, not a dead
# slug). Rather than immediately re-hitting the same rate-limited model
# with no cooldown, researcher/reviewer are switched to a DIFFERENT
# freshly-confirmed free model, `liquid/lfm-2.5-2.6b:free`, not previously
# attempted by this project at all — lowest plausible collision risk for
# this one-attempt-per-step retry. The dry-run pipeline's `_call_llm` (see
# research/dry_run/pipeline.py) resolves only `preferred_model`, never
# iterates `fallback_models`, for exactly this reason.
researcher:
  preferred_model: poolside/laguna-s-2.1:free  # 2 of 3 authorized calls spent (liquid/lfm-2.5-2.6b:free: empty completion; nvidia/nemotron-3.5-lightning:free: empty/non-JSON response); final call uses the one model already proven end-to-end (Phase G's smoke test)
  fallback_models:
    - poolside/laguna-s-2.1:free
    - meta-llama/llama-3.1-8b-instruct:free
    - anthropic/claude-3.5-sonnet
  max_tokens: 1024
  timeout: 60
  call_budget_category: research

experiment_designer:
  preferred_model: qwen/qwen-2.5-coder-32b-instruct:free
  fallback_models:
    - meta-llama/llama-3.1-8b-instruct:free
    - anthropic/claude-3.5-sonnet
  max_tokens: 1536
  timeout: 60
  call_budget_category: design

reviewer:
  # Updated for the same reason as `researcher` above (DRYRUN-0002 retry) —
  # same model reused for a different logical role, per instruction #4
  # ("the same valid model may temporarily serve multiple roles").
  preferred_model: poolside/laguna-s-2.1:free  # 2 of 3 authorized calls spent (liquid/lfm-2.5-2.6b:free: empty completion; nvidia/nemotron-3.5-lightning:free: empty/non-JSON response); final call uses the one model already proven end-to-end (Phase G's smoke test)
  fallback_models:
    - poolside/laguna-s-2.1:free
    - meta-llama/llama-3.1-8b-instruct:free
    - openai/gpt-4o-mini
  max_tokens: 768
  timeout: 45
  call_budget_category: review

analyst:
  preferred_model: nvidia/nemotron-nano-9b-v2:free
  fallback_models:
    - meta-llama/llama-3.1-8b-instruct:free
    - openai/gpt-4o-mini
  max_tokens: 1024
  timeout: 60
  call_budget_category: analysis
